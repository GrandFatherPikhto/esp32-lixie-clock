# ============================================================================
# Clock firmware configuration - complete reference of ALL settings
# ============================================================================
#
# This single YAML file drives the Python helper scripts:
#   - tools/configure_clock.py  ->  provisions the device over USB
#     (python tools/configure_clock.py apply [--save] [--reboot])
#   - tools/build_target.py     ->  build defaults (the "build:" section)
#
# Sections:
#   wi-fi   : network the clock connects to
#   time    : NTP server, sync interval, timezone, sync method
#   display : digits, brightness, LED GPIO, colour palette, breathing
#   serial  : USB port / baud / timeout used by configure_clock.py
#   build   : defaults for build_target.py
#
# Top-level device keys match the firmware `set` keys 1:1 (all are validated
# / range-checked on the device). The `serial:` and `build:` sections are NOT
# sent to the device - they are reserved for the tools.
#
# NOTE: ssid / password are real Wi-Fi credentials. Keep this file (or at
# least the credentials) out of version control if you don't want them pushed.
# ============================================================================


# ---------------------------------------------------------------------------
# Wi-Fi
# ---------------------------------------------------------------------------
ssid: "MyWiFi"          # Wi-Fi network name (must be set for the clock to sync)
password: "change-me"   # Wi-Fi password (masked on the console by the tool)
wifi_power_save: false  # switch the Wi-Fi radio off after time sync (0/1 or true/false)

# ---------------------------------------------------------------------------
# Time / NTP
# ---------------------------------------------------------------------------
ntp_server: "pool.ntp.org"   # NTP hostname (string)
sync_interval: 3600          # NTP sync period in seconds (30 .. 604800)
tz_offset: 180               # UTC offset in minutes (-840 .. 840); 180 = UTC+3 (Moscow)
sync_method: 0               # 0 = immediate jump, 1 = smooth (adjtime)

# ---------------------------------------------------------------------------
# Display
# ---------------------------------------------------------------------------
digits: 6                    # number of digit positions shown (1 .. 6)
brightness: 100              # LED brightness in percent (0 .. 100)
gpio: 14                     # WS2812 data GPIO (0 .. 39); applies after reboot
color_mode: 0                # colour palette, 0..5 (see "Palettes" below)
hue: 200                     # base hue 0..359 (used by Mono and Triad)
hue_shift: 0                 # global base-hue offset 0..359 (0 = classic look)
hue_2: 200                   # secondary hue 0..359 (Mono two-tone when != hue)
breathing: false             # pulse the brightness (combines with any palette)
night_mode: false            # master switch for automatic night dimming (0/1 or true/false)
night_low_brightness: 5      # brightness in percent used during night hours (0..100)
night_start: 23              # night window start hour (0..23, inclusive)
night_end: 7                 # night window end hour (0..23, exclusive; wraps midnight)
cross_fade: 150              # fade duration for digit changes in ms (0 = off, instant)
slot_machine_interval: 30    # minutes between automatic 0..9 "slot machine" rolls (0 = off)

# ---------------------------------------------------------------------------
# Palettes (color_mode) - switch anytime with: set color_mode=<N>
# ---------------------------------------------------------------------------
#  0 = Garland  (default, original) - the three pairs start at
#              red(0) / green(120) / blue(240) and each pair rotates
#              its colour at its own pace. The classic look.
#  1 = Mono     - every digit one fixed colour = `hue`.
#  2 = Triad    - fixed per-pair colours: pair1 = `hue`,
#              pair2 = `hue`+120, pair3 = `hue`+240 (static).
#  3 = Spectrum - rainbow sweep: one hue shared by all pairs, slowly
#              rotating through the whole spectrum.
#  4 = Prism    - one static colour per digit position (6-step rainbow
#              across the display; no rotation).
#  5 = Chronos  - colour encodes the time: hours pair hue = hour*15,
#              minutes pair = min*6, seconds pair = sec*6.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Serial connection (tools/configure_clock.py)
# ---------------------------------------------------------------------------
serial:
  port: ""                   # e.g. "COM5" (Windows) or "/dev/ttyUSB0" (Linux); empty = auto-detect
  baud: 115200               # baud rate of the firmware console
  timeout: 8                 # seconds to wait for a device response

# ---------------------------------------------------------------------------
# Build defaults (tools/build_target.py)
# ---------------------------------------------------------------------------
build:
  target: "esp32"            # esp32, esp32s2, esp32s3, esp32c3, esp32c6, esp32h2
  menuconfig: false          # open menuconfig before building
  clean: false               # run a full clean build
  flash: false               # flash the firmware after building
  monitor: false             # open the serial monitor after flashing
